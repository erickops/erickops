  <meta property="og:url"          content="https://erickops.space/blog.html">
  <meta property="og:image"        content="https://erickops.space/assets/bg.jpg">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:site"        content="@erickops">
  <meta name="twitter:title"       content="erickops — blog">
  <meta name="twitter:description" content="All posts — networking, coding, cybersecurity, life, love, and random stuff.">
  <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Circle-icons-rocket.svg/1200px-Circle-icons-rocket.svg.png">

</head>
<body class="bg-purple">

  <div class="stars">

    <div class="objects">
      <img class="object_rocket" src="./assets/rocket.svg" width="40px" alt="">
      <div class="box_astronaut">
        <img class="object_astronaut" src="./assets/astronaut.svg" width="140px" alt="">
      </div>
    </div>
    <div class="glowing_stars">
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div>
    </div>

    <!-- Navbar -->
    <nav class="custom-navbar">
      <div class="brand-logo">
        <a href="index.html">erick<span>ops</span>.space</a>
      </div>
      <div class="hamburger" onclick="toggleNav()">
        <span></span><span></span><span></span>
      </div>
      <div class="navbar-links" id="navLinks">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="blog.html" class="active">Blog</a></li>
          <li><a href="cats.html">Cats</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="write.html">Write</a></li>
          <li><a href="https://linktr.ee/erickops" class="btn-request" target="_blank" rel="noopener">Find Me</a></li>
        </ul>
      </div>
    </nav>

    <div class="page-wrapper">
      <div class="blog-page-wrapper">

        <div class="blog-header">
          <h1>// All Posts</h1>
          <p>Networking · Coding · Cybersecurity · Life · Love · Random</p>
        </div>

        <!-- Search -->
        <div class="search-bar">
          <input type="text" class="search-input" id="searchInput" placeholder="Search posts..." oninput="filterPosts()">
          <button class="search-btn" aria-label="Search">🔍</button>
        </div>

        <!-- Filter buttons -->
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" data-cat="all"      onclick="setFilter('all', this)">All</button>
          <button class="filter-btn" data-cat="network"         onclick="setFilter('network', this)">📡 Network</button>
          <button class="filter-btn" data-cat="security"        onclick="setFilter('security', this)">🔐 Security</button>
          <button class="filter-btn" data-cat="coding"          onclick="setFilter('coding', this)">💻 Coding</button>
          <button class="filter-btn" data-cat="life"            onclick="setFilter('life', this)">🌱 Life</button>
          <button class="filter-btn" data-cat="love"            onclick="setFilter('love', this)">💙 Love</button>
          <button class="filter-btn" data-cat="random"          onclick="setFilter('random', this)">✨ Random</button>
        </div>

        <!-- Posts grid -->
        <div class="posts-grid" id="posts-container">
          <div class="loading">Loading posts...</div>
        </div>

        <!-- No results -->
        <div class="empty-state" id="no-results" style="display:none;">
          <span class="empty-icon">🔭</span>
          <p>Nothing found. Try a different keyword.</p>
        </div>

      </div>
    </div>

    <footer class="site-footer">
      <p>© <span id="year"></span> erickops.space — made with ☕ and 20 cats</p>
    </footer>

  </div>

  <div class="toast" id="toast"></div>

  <script src="./script.js"></script>
  <script>
    let allPosts = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('year').textContent = new Date().getFullYear();
      await loadAllPosts();
    });

    async function loadAllPosts() {
      const container = document.getElementById('posts-container');
      try {
        allPosts = await fetchPosts();
        renderPosts(allPosts);
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><span class="empty-icon">📡</span><p>Couldn\'t load posts. Try refreshing.</p></div>';
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      const noResults = document.getElementById('no-results');
      if (posts.length === 0) {
        container.innerHTML = '';
        noResults.style.display = 'block';
        return;
      }
      noResults.style.display = 'none';
      container.innerHTML = '';
      posts.forEach((post, i) => {
        const card = buildPostCard(post, i);
        container.appendChild(card);
      });
    }

    function setFilter(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterPosts();
    }

    function filterPosts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allPosts;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(p => p.category === currentFilter);
      }
      if (q) {
        filtered = filtered.filter(p =>
          p.title.toLowerCase().includes(q) ||
          p.excerpt.toLowerCase().includes(q) ||
          (p.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }
      renderPosts(filtered);
    }
  </script>
</body>
</html>
